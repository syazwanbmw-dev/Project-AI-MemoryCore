<!--
  PLAN ARTIFACT TEMPLATE - work-plan Lv.3 "Plan Artifact Review"

  DUA penanda gantian sahaja - diletak di dua tempat sebenar di bawah:
    - dalam elemen tajuk (baris TITLE)  -> nama plan
    - dalam MAIN, selepas .plan-meta      -> badan plan (markdown -> HTML)

  Peraturan render markdown -> HTML untuk badan:
    - Heading -> h2 dengan id="slug"  (slug = kebab-case teks heading)
    - blok pagar mermaid  -> pre class="mermaid"  (Artifact render native)
    - blok pagar lain      -> pre > code
    - "- [ ] x" / "- [x] x" -> li class="todo" / li class="todo done"
    - inline: backtick -> code, **tebal** -> strong, *condong* -> em,
      [teks](url) -> anchor
    - selain itu: p, ul, ol, table (balut div.table-scroll), blockquote
    - escape &, kurang-daripada, lebih-daripada dalam semua teks + kandungan blok kod

  Peraturan publish:
    - JANGAN tambah doctype / html / head / body - Artifact bungkus skeleton sendiri.
    - JANGAN load sebarang skrip mermaid - Artifact render pre.mermaid sendiri.
    - Republish revisi ke fail path yang SAMA supaya URL kekal.
-->
<title>{{PLAN_TITLE}}</title>

<style>
  :root {
    --bg: #ffffff;
    --fg: #1e293b;
    --fg-soft: #334155;
    --heading: #0f172a;
    --border: #e2e8f0;
    --accent: #2563eb;
    --code-bg: #f1f5f9;
    --code-fg: #0f172a;
    --card-bg: #f8fafc;
    --done-fg: #64748b;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --fg-soft: #cbd5e1;
      --heading: #f8fafc;
      --border: #1e293b;
      --accent: #60a5fa;
      --code-bg: #1e293b;
      --code-fg: #e2e8f0;
      --card-bg: #131c31;
      --done-fg: #94a3b8;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0f172a;
    --fg: #e2e8f0;
    --fg-soft: #cbd5e1;
    --heading: #f8fafc;
    --border: #1e293b;
    --accent: #60a5fa;
    --code-bg: #1e293b;
    --code-fg: #e2e8f0;
    --card-bg: #131c31;
    --done-fg: #94a3b8;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    padding: 2.5rem 1.25rem 6rem;
  }

  main {
    max-width: 46rem;
    margin: 0 auto;
  }

  .plan-meta {
    color: var(--fg-soft);
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.75rem;
    margin-bottom: 2rem;
  }

  h1, h2, h3, h4 {
    color: var(--heading);
    line-height: 1.3;
    scroll-margin-top: 1.5rem;
  }
  h1 { font-size: 1.9rem; margin: 0 0 1rem; }
  h2 {
    font-size: 1.35rem;
    margin: 2.5rem 0 0.75rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--border);
  }
  h3 { font-size: 1.1rem; margin: 1.75rem 0 0.5rem; }

  p, li { color: var(--fg); }
  a { color: var(--accent); }

  code {
    background: var(--code-bg);
    color: var(--code-fg);
    padding: 0.12em 0.4em;
    border-radius: 4px;
    font: 0.88em/1.5 "SF Mono", "Cascadia Code", Consolas, monospace;
  }

  pre {
    background: var(--code-bg);
    color: var(--code-fg);
    padding: 1rem 1.15rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    overflow-x: auto;
  }
  pre code { background: none; padding: 0; font-size: 0.85rem; }

  /* Artifact renders this natively into a themed flowchart */
  pre.mermaid {
    background: var(--card-bg);
    text-align: center;
    line-height: 1.4;
  }

  blockquote {
    margin: 1rem 0;
    padding: 0.5rem 1rem;
    border-left: 3px solid var(--accent);
    background: var(--card-bg);
    color: var(--fg-soft);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin: 1rem 0;
    font-size: 0.92rem;
  }
  th, td {
    border: 1px solid var(--border);
    padding: 0.5rem 0.7rem;
    text-align: left;
    color: var(--fg);
  }
  th { background: var(--card-bg); color: var(--heading); }

  ul, ol { padding-left: 1.4rem; }
  li { margin: 0.3rem 0; }

  li.todo { list-style: none; margin-left: -1.4rem; padding-left: 1.6rem; position: relative; }
  li.todo::before {
    content: "\2610";
    position: absolute;
    left: 0;
    color: var(--accent);
  }
  li.todo.done { color: var(--done-fg); text-decoration: line-through; }
  li.todo.done::before { content: "\2611"; color: var(--done-fg); }

  .table-scroll { overflow-x: auto; }
</style>

<main>
  <div class="plan-meta">Plan review &middot; anotasi guna comment thread &middot; balas "approve" bila puas hati</div>
  {{PLAN_BODY}}
</main>
